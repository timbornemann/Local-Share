<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8f4">
    <title>Local Share</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Local Share</h1>
          <p>Temporary files and text for this network.</p>
        </div>
        <div class="status" id="connectionStatus">Connecting</div>
      </header>

      <div class="compose-tabs" id="composeTabs" aria-label="Share type">
        <button type="button" class="active" data-compose-tab="files">Files</button>
        <button type="button" data-compose-tab="text">Text</button>
      </div>

      <section class="compose" id="composeView">
        <label class="dropzone" id="dropzone" data-compose-panel="files">
          <input id="fileInput" type="file" multiple>
          <span class="drop-title">Choose files</span>
          <span class="drop-subtitle">Tap, click, or drop anything from your device</span>
        </label>

        <form class="text-share" id="textForm" data-compose-panel="text">
          <input id="textName" type="text" maxlength="120" placeholder="Optional text name">
          <textarea id="textInput" rows="7" placeholder="Paste raw text"></textarea>
          <button type="submit">Share Text</button>
        </form>
      </section>

      <section class="detail" id="detailView" hidden>
        <div class="detail-bar">
          <button type="button" class="secondary" id="backButton">Back</button>
          <div class="detail-actions" id="detailActions"></div>
        </div>
        <div class="detail-title">
          <span class="badge" id="detailBadge">item</span>
          <h2 id="detailName">Loading</h2>
        </div>
        <div class="item-meta detail-meta" id="detailMeta"></div>
        <div class="preview" id="previewArea"></div>
      </section>

      <section class="list-head" id="listHead">
        <h2>Available now</h2>
        <p id="itemCount">0 items</p>
      </section>

      <section class="items" id="items" aria-live="polite">
        <div class="empty">Nothing shared yet.</div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
